name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan berkas web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Pasang Capacitor
        run: npm install

      - name: Tambah proyek Android
        run: npx cap add android

      - name: Pasang ikon bedug
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
            done
          done

      - name: Sinkronkan
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Waktu-Sholat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Waktu-Sholat-APK
          path: Waktu-Sholat.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" Waktu-Sholat.apk --title "Waktu Sholat APK #${{ github.run_number }}" --notes "Developed by Ongarand. APK debug, pasang manual di Android."
