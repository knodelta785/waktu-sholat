name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt', 'app-config.json']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan berkas web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/
          sed -i "s|/\*BUILD\*/0|${{ github.run_number }}|" www/index.html
          grep -c "APP_BUILD = ${{ github.run_number }}" www/index.html

      - name: Pasang Capacitor
        run: npm install

      - name: Tambah proyek Android
        run: npx cap add android

      - name: Kunci penandatangan
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/ws.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_B64 belum diatur. APK debug dipakai; update di atas versi lama akan gagal sebelum aplikasi lama dihapus."
          fi

      - name: Pasang bagian native
        env:
          BUILD_NUM: ${{ github.run_number }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then export KS_FILE="$GITHUB_WORKSPACE/ws.keystore"; fi
          python3 tools/patch_android.py

      - name: Pasang ikon bedug
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
            done
          done

      - name: Sinkronkan
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Waktu-Sholat.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Waktu-Sholat.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Waktu-Sholat-APK
          path: Waktu-Sholat.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Waktu-Sholat.apk \
            --title "Waktu Sholat build ${{ github.run_number }}" \
            --notes "Developed by Ongarand" --latest
