<style>

<script>
const LOGO = cls => '<svg class="' + cls + '" viewBox="0 0 120 120" aria-hidden="true"><use href="#bedug"/></svg>';
// ===== Bagian murni: hitungan waktu sholat, tanggal, kalender KHGT, helper lokasi =====
const MONTHS_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const MON_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const DAYS_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const HMONTHS = ['Muharram', 'Safar', 'Rabiul Awal', 'Rabiul Akhir', 'Jumadil Awal', 'Jumadil Akhir', 'Rajab', 'Syaban', 'Ramadan', 'Syawal', 'Dzulkaidah', 'Dzulhijjah'];
const pad = n => String(n).padStart(2, '0');
const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const isoFromNum = n => new Date(n * 86400000).toISOString().slice(0, 10);
const addDays = (iso, n) => isoFromNum(dayNum(iso) + n);
const dowOf = iso => new Date(dayNum(iso) * 86400000).getUTCDay();
const cityToday = tz => new Date(Date.now() + tz * 3600000).toISOString().slice(0, 10);
const epochOf = (iso, hm, tz) => {
  const [y, m, d] = iso.split('-').map(Number); const [h, mi] = hm.split(':').map(Number);
  return Date.UTC(y, m - 1, d, h, mi) - tz * 3600000;
};
const fmtLong = iso => { const [y, m, d] = iso.split('-').map(Number); return DAYS_ID[dowOf(iso)] + ', ' + d + ' ' + MONTHS_ID[m - 1] + ' ' + y; };
const fmtShort = iso => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON_SHORT[m - 1]; };
const fmtMid = iso => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON_SHORT[m - 1] + ' ' + y; };
const tzLabel = tz => tz === 7 ? 'WIB' : tz === 8 ? 'WITA' : tz === 9 ? 'WIT' : 'UTC' + (tz >= 0 ? '+' : '') + tz;

// ---- Astronomi dasar (mengikuti pendekatan PrayTimes) ----
const D2R = Math.PI / 180;
const dsin = d => Math.sin(d * D2R), dcos = d => Math.cos(d * D2R), dtan = d => Math.tan(d * D2R);
const darcsin = x => Math.asin(x) / D2R, darccos = x => Math.acos(x) / D2R, darctan2 = (y, x) => Math.atan2(y, x) / D2R, darccot = x => Math.atan(1 / x) / D2R;
const fixAngle = a => a - 360 * Math.floor(a / 360);
const fixHour = h => h - 24 * Math.floor(h / 24);
function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D), q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = fixHour(darctan2(dcos(e) * dsin(L), dcos(L)) / 15);
  return { decl: darcsin(dsin(e) * dsin(L)), eqt: q / 15 - RA };
}
function computeTimes(y, m, d, lat, lng, tz, cfg) {
  const jd = julian(y, m, d) - lng / (15 * 24);
  const dec = t => sunPosition(jd + t).decl, eqt = t => sunPosition(jd + t).eqt;
  const mid = t => fixHour(12 - eqt(t));
  const angleT = (angle, t, ccw) => {
    const dc = dec(t);
    const x = (-dsin(angle) - dsin(dc) * dsin(lat)) / (dcos(dc) * dcos(lat));
    if (x > 1 || x < -1) return NaN;
    const v = darccos(x) / 15;
    return mid(t) + (ccw ? -v : v);
  };
  const asrT = (f, t) => { const dc = dec(t); return angleT(-darccot(f + dtan(Math.abs(lat - dc))), t, false); };
  let t = { fajr: 5 / 24, sunrise: 6 / 24, dhuhr: 12 / 24, asr: 13 / 24, sunset: 18 / 24, isha: 18 / 24, dhuha: 7 / 24 };
  let r = {};
  for (let i = 0; i < 3; i++) {
    r = {
      fajr: angleT(cfg.fajr, t.fajr, true), sunrise: angleT(0.833, t.sunrise, true), dhuhr: mid(t.dhuhr),
      asr: asrT(cfg.asr || 1, t.asr), maghrib: angleT(0.833, t.sunset, false), isha: NaN, dhuha: angleT(-4.5, t.dhuha, true)
    };
    r.isha = cfg.ishaMin ? r.maghrib + cfg.ishaMin / 60 : angleT(cfg.isha, t.isha, false);
    t = { fajr: r.fajr / 24, sunrise: r.sunrise / 24, dhuhr: r.dhuhr / 24, asr: r.asr / 24, sunset: r.maghrib / 24, isha: r.isha / 24, dhuha: r.dhuha / 24 };
    if (Object.values(r).some(v => !isFinite(v))) break;
  }
  const adj = tz - lng / 15;
  for (const k in r) r[k] = r[k] + adj;
  return r;
}
const CFG = {
  kemenag: { fajr: 20, isha: 18, ihtiyat: true },
  MWL: { fajr: 18, isha: 17 }, SINGAPORE: { fajr: 20, isha: 18 }, EGYPT: { fajr: 19.5, isha: 17.5 },
  MAKKAH: { fajr: 18.5, ishaMin: 90 }, KARACHI: { fajr: 18, isha: 18 }, ISNA: { fajr: 15, isha: 15 }
};
const MP_METHODS = [['MWL', 'Liga Muslim Dunia (MWL)'], ['SINGAPORE', 'Singapura (MUIS)'], ['EGYPT', 'Otoritas Umum Mesir'], ['MAKKAH', 'Umm al-Qura (Makkah)'], ['KARACHI', 'Univ. Karachi'], ['ISNA', 'ISNA (Amerika Utara)']];
function formatDay(raw, cfg) {
  const mins = k => raw[k] * 60;
  let o;
  if (cfg.ihtiyat) {
    const c = k => Math.ceil(mins(k) - 1e-9) + 2;
    const subuh = c('fajr');

function tick() {

  if (now >= NEXT.t) { refreshNext(); render(); return; }
  if (cd) {
    const s = Math.max(0, Math.round((NEXT.t - now) / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    cd.textContent = 'dalam ' + (hh ? hh + ' j ' : '') + pad(mm) + ' m ' + pad(ss) + ' d';

}

document.addEventListener('click', ev => {

  const sb = ev.target.closest('[data-set-btn]');

    const k = sb.getAttribute('data-set-btn'), v = sb.getAttribute('data-v');
    S[k] = v; save();
    if (k === 'theme') applyTheme();
    render(); if (k === 'source' || k === 'asr') loadDay(false);
    return;
  }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.getAttribute('data-act');
  if (act === 'gps') doGPS();
  else if (act === 'search') doSearch($('#q') && $('#q').value);
  else if (act === 'pick') pickResult(+a.getAttribute('data-i'));
  else if (act === 'reload') { store.del('ws.day'); loadDay(true); toast('Memuat ulang data hari ini…'); }
  else if (act === 'bell') {
    const k = a.getAttribute('data-k');
    if (!S.remind) { enableReminders().then(ok => { if (ok) { S.rem[k] = true; save(); render(); scheduleReminders(); } }); return; }
    S.rem[k] = !S.rem[k]; save(); render(); scheduleReminders();
  }
  else if (act === 'testrem') { toast('Contoh pengingat: waktu Dzuhur'); if (S.sound) beep(); systemNotify('Waktu Sholat', 'Contoh pengingat: waktu Dzuhur'); }
  else if (act === 'calview') { S.calView = a.getAttribute('data-v'); save(); render(); }
  else if (act === 'calprev') { CAL_IDX = Math.max(0, calIndex() - 1); render(); }
  else if (act === 'calnext') { CAL_IDX = Math.min(KH.length - 2, calIndex() + 1); render(); }
  else if (act === 'caltoday') { CAL_IDX = null; render(); }
  else if (act === 'calgo') { CAL_IDX = +a.getAttribute('data-i'); S.calView = 'bulan'; save(); render(); window.scrollTo(0, 0); }
});

async function enableReminders() {
  try {
    if ('Notification' in window && Notification.permission === 'default') { await Notification.requestPermission(); }
  } catch (e) { }
  S.remind = true; save();
  const granted = ('Notification' in window) && Notification.permission === 'granted';
  toast(granted ? 'Pengingat aktif. Aplikasi harus tetap terbuka.' : 'Pengingat aktif dengan bunyi dan pesan di layar (notifikasi sistem tidak diizinkan).');
  return true;
}
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.matches('[data-city]')) { if (t.value) pickCityId(t.value); return; }
  const k = t.getAttribute && t.getAttribute('data-set'); if (!k) return;
  if (k === 'remind') {
    if (t.checked) { await enableReminders(); } else { S.remind = false; save(); }
    render(); scheduleReminders(); return;
  }
  S[k] = t.type === 'checkbox' ? t.checked : t.hasAttribute('data-num') ? +t.value : t.value;
  save();
  if (k === 'mp') { render(); loadDay(false); return; }
  if (k === 'imsak' || k === 'dhuha') { refreshNext(); render(); scheduleReminders(); return; }
  if (k === 'lead' || k === 'sound') { scheduleReminders(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); scheduleReminders(); } });

// ---------- Mulai ----------
function init() {
  applyTheme(); render();
  try { if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
  loadDay(false);
  setInterval(tick, 1000);
  // perbarui titik GPS secara senyap bila izin sudah diberikan sebelumnya
  try {
    if (navigator.permissions && navigator.permissions.query && (!S.loc || S.loc.mode === 'gps')) {
      navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') doGPS(); }).catch(() => { });
    }
  } catch (e) { }
}
init();

</script>
