<title>Waktu Sholat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
/* Tata letak: satu kolom 560px, kartu waktu dengan cincin hitung mundur, tab bawah. Palet: tinta hutan, kulit bedug, emas kuningan, krem kertas. */
:root{
  --bg:#f3efe6; --surface:#fbf9f3; --surface2:#ece6d7; --ink:#1d2a24; --muted:#67716a; --line:#d9d2c0;
  --accent:#1f6b52; --accent-ink:#ffffff; --gold:#b27a1e; --hot:#b4472a; --ok:#1f6b52; --warn:#9a5b00; --warnbg:#f6e7c8; --ring:#e3dccb;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif; --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17211c; --surface2:#1f2c26; --ink:#ece8dc; --muted:#98a39b; --line:#2b3a33;
  --accent:#58c29b; --accent-ink:#0b1712; --gold:#e0a846; --hot:#e07a5a; --ok:#58c29b; --warn:#e0b04c; --warnbg:#3a2f14; --ring:#27362f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17211c; --surface2:#1f2c26; --ink:#ece8dc; --muted:#98a39b; --line:#2b3a33;
  --accent:#58c29b; --accent-ink:#0b1712; --gold:#e0a846; --hot:#e07a5a; --ok:#58c29b; --warn:#e0b04c; --warnbg:#3a2f14; --ring:#27362f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
body.native{padding-top:max(env(safe-area-inset-top,0px),40px);padding-bottom:120px}
body.native nav.tabs{padding-bottom:max(env(safe-area-inset-bottom,0px),14px)}
body.native #toast{bottom:calc(96px + max(env(safe-area-inset-bottom,0px),14px))}
body.native .sheet{padding-bottom:max(calc(16px + env(safe-area-inset-bottom,0px)),32px)}
header.top .t{display:flex;flex-direction:column;line-height:1.15}
header.top b{font:600 22px var(--font-d);letter-spacing:.01em}
header.top small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.logo{width:44px;height:44px;flex:none}
#view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.locchip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.locchip .ic{color:var(--accent)}
.lc-t{display:flex;flex-direction:column;min-width:0}
.lc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datel{margin:0;text-align:center;font:500 17px var(--font-d)}
.hij{color:var(--gold);font:600 14px var(--font-b);letter-spacing:.02em}
.hero{display:flex;justify-content:center}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rim{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.stud{fill:var(--gold);opacity:.55}
.track{fill:none;stroke:var(--ring);stroke-width:10}
.arc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.next-l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next-n{font:600 28px var(--font-d)}
.next-t{font:600 46px/1 var(--font-d);font-variant-numeric:tabular-nums;color:var(--accent)}
.next-cd{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;font-weight:500}
.row .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.row .tm{font:600 20px var(--font-d);font-variant-numeric:tabular-nums}
.row .tm.sm{font:500 14px var(--font-b);color:var(--muted)}
.row.minor{padding-block:9px}
.row.minor .nm{color:var(--muted);font-weight:400}
.row.minor .tm{font-size:16px;color:var(--muted)}
.row.past{opacity:.55}
.row.next{background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:inset 4px 0 0 var(--accent)}
.bell,.bell-sp{width:36px;height:36px;flex:none}
.bell{border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.bell.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.nopad{padding:0;gap:0}
.card.src{font-size:13px}
.card.src b{font-weight:600}
.card.src span{color:var(--muted)}
.card.src.ok b{color:var(--ok)}
.card.src.warn{background:var(--warnbg);border-color:transparent}
.card.src.warn b{color:var(--warn)}
.card.note{border-color:var(--gold)}
.card.note p{margin:0}
.warn-t{color:var(--warn);margin:0;font-size:13px}
.hint,.muted{color:var(--muted);font-size:13px;margin:0}
.muted.pad{padding:12px 16px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{min-height:40px;padding:8px 14px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.sec h2{font:600 13px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px}
.curloc{display:flex;gap:10px;align-items:flex-start}
.curloc .ic{color:var(--accent);margin-top:2px}
.curloc span{display:flex;flex-direction:column;min-width:0}
.curloc small{color:var(--muted);font-size:12.5px}
.lbl{font-size:13px;color:var(--muted);margin-top:4px}
.sr{display:flex;gap:8px}
input[type=search],select{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
input[type=search]{min-width:0}
.reslist{max-height:260px;overflow:auto}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:500;min-height:40px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg.three button{font-size:12.5px;padding-inline:4px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field>span:first-child{display:flex;flex-direction:column;min-width:0}
.field small{color:var(--muted);font-size:12.5px;font-weight:400}
.field select{width:auto;min-width:150px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.about{flex-direction:row;align-items:center;gap:12px}
.about div{display:flex;flex-direction:column;gap:2px}
.about span{color:var(--gold);font-weight:600}
.about small{color:var(--muted);font-size:12.5px}
.ab-logo{width:56px;height:56px;flex:none}
.hnow .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hnow b{font:600 24px var(--font-d);color:var(--gold)}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cm{display:flex;flex-direction:column;align-items:center;text-align:center}
.cm b{font:600 21px var(--font-d)}
.cm small{color:var(--muted);font-size:12.5px}
.icb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icb:disabled{opacity:.35;cursor:default}
.est{font-style:normal;color:var(--warn);font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{aspect-ratio:1/1.05;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0}
.cell.empty{background:none;border:0}
.cell b{font:600 16px var(--font-d)}
.cell small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.fri b{color:var(--accent)}
.cell.abd{background:var(--surface2)}
.cell.ev{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.cell.today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.today small,.cell.today b{color:var(--accent-ink)}
.evl .ei{display:flex;gap:12px;font-size:13.5px;padding-top:6px;border-top:1px solid var(--line)}
.evl .ei span:first-child{flex:none;width:90px;color:var(--gold);font-weight:600}
.evl .ei span:last-child{min-width:0}
.card.fine span{color:var(--muted);font-size:12.5px}
.trow .len{color:var(--muted);font-size:12.5px;width:56px;text-align:right}
.tbl .row{cursor:pointer}
.widget{background:linear-gradient(160deg,#1f6b52,#124434);color:#f4efe0;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgb(0 0 0/.18)}
.w-head{display:flex;align-items:center;gap:10px}
.w-head b{font:600 17px var(--font-d)}
.w-head small{display:block;opacity:.8;font-size:12px}
.w-logo{width:36px;height:36px;flex:none}
.w-date{margin:0;font-size:13px;opacity:.9}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.wc{background:rgb(255 255 255/.10);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.wc span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.wc b{font:600 22px var(--font-d);font-variant-numeric:tabular-nums}
.wc.minor b{font-size:18px;opacity:.9}
.wc.past{opacity:.55}
.wc.next{background:#f4efe0;color:#124434;opacity:1}
.w-foot{margin:0;font-size:11.5px;opacity:.75}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);z-index:30;box-shadow:0 6px 20px rgb(0 0 0/.25)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
#tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:11.5px;color:var(--muted);min-height:56px}
.tab[aria-current=page]{color:var(--accent);font-weight:600}
a.btn{text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bm{font-size:12px;color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 8px;border-radius:99px}
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 30px rgb(0 0 0/.25)}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 8px}
.sh-h b{font:600 22px var(--font-d)}
.sh-h span{font:600 20px var(--font-d);color:var(--accent);font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt-b{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:13px 14px;min-height:48px;font-weight:500}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.opt.on .rd{border-color:var(--accent)}
.opt.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.pv{width:44px;height:44px;border:0;background:none;color:var(--accent);display:grid;place-items:center;flex:none}
.pv .ic{fill:currentColor;stroke:none;width:18px;height:18px}
.sh-f{display:flex;gap:8px;justify-content:flex-end;padding-top:6px}
#force{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#force[hidden]{display:none}
.fbox{max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.fbox h1{font:600 26px var(--font-d);margin:0}
.fbox p{margin:0;color:var(--muted)}
.f-logo{width:84px;height:84px}
@media (prefers-reduced-motion:reduce){.arc,.sw i,.sw i::after{transition:none}}
@media (max-width:380px){.next-t{font-size:40px}.row .tm{font-size:18px}}
</style>

function calcFor(loc, iso) { return calcDay(loc.lat, loc.lng, loc.tz, iso, methodKey(), S.asr); }
function dayKey(loc, iso) { return [iso, loc.lat.toFixed(2), loc.lng.toFixed(2), loc.tz, S.source, S.mp, S.asr].join('|'); }
function tzName(tz) { return tz === 8 ? 'Asia/Makassar' : tz === 9 ? 'Asia/Jayapura' : 'Asia/Jakarta'; }

async function fetchKemenag(loc, iso) {
  const kw = kemenagKeyword(loc.area); if (!kw) return null;
  const [y, m, d] = iso.split('-'), enc = encodeURIComponent;
  const bases = [
    { s: 'https://api.myquran.com/v2/sholat/kota/cari/' + enc(kw.name), j: id => 'https://api.myquran.com/v2/sholat/jadwal/' + id + '/' + y + '/' + m + '/' + d },
    { s: 'https://api.myquran.com/v3/sholat/kabkota/cari/' + enc(kw.name), j: id => 'https://api.myquran.com/v3/sholat/jadwal/' + id + '/' + iso + '?tz=' + tzName(loc.tz) }
  ];
  for (const b of bases) {
    try {
      const pick = pickCity(findList(await getJSON(b.s)), kw); if (!pick) continue;
      const sch = findSchedule(await getJSON(b.j(pick.id))); if (!sch) continue;
      const t = { imsak: normHM(sch.imsak), subuh: normHM(sch.subuh), terbit: normHM(sch.terbit), dhuha: normHM(sch.dhuha), dzuhur: normHM(sch.dzuhur || sch.dhuhur), ashar: normHM(sch.ashar), maghrib: normHM(sch.maghrib), isya: normHM(sch.isya) };
      if (!t.subuh || !t.dzuhur || !t.ashar || !t.maghrib || !t.isya) continue;
      const own = calcFor(loc, iso);
      ['imsak', 'terbit', 'dhuha'].forEach(k => { if (!t[k]) t[k] = own[k]; });
      return { times: t, kind: 'resmi', label: String(pick.lokasi || pick.nama || pick.name || kw.name) };
    } catch (e) { /* coba sumber berikutnya */ }
  }
  return null;
}
function calcResult(loc, iso, fallback) { return { times: calcFor(loc, iso), kind: fallback ? 'cadangan' : 'hitung', label: '' }; }
async function loadDay(force) {
  const loc = curLoc(), iso = cityToday(loc.tz), key = dayKey(loc, iso);
  const cached = store.get('ws.day', null);
  if (!force && cached && cached.key === key && cached.times) {
    DAY = cached; DAY_DATE = iso; refreshNext(); render(); scheduleReminders(); return;
  }
  const first = calcResult(loc, iso, false);
  DAY = Object.assign({ key, date: iso, at: Date.now(), pending: S.source === 'kemenag' }, first); DAY_DATE = iso;
  refreshNext(); render(); scheduleReminders();
  if (S.source === 'kemenag') {
    let online = null;
    try { online = await fetchKemenag(loc, iso); } catch (e) { }
    if (dayKey(curLoc(), cityToday(curLoc().tz)) !== key) return;
    DAY = online ? Object.assign({ key, date: iso, at: Date.now() }, online) : Object.assign({ key, date: iso, at: Date.now() }, calcResult(loc, iso, true));
  } else DAY.pending = false;
  store.set('ws.day', DAY); refreshNext(); render(); scheduleReminders();
}

// ---------- Susunan acara hari ini ----------
function buildEvents(day, iso, tz) {
  const defs = [['imsak', S.imsak, 1], ['subuh', true, 0], ['terbit', true, 1], ['dhuha', S.dhuha, 1], ['dzuhur', true, 0], ['ashar', true, 0], ['maghrib', true, 0], ['isya', true, 0]];
  return defs.filter(d => d[1]).map(d => {
    const hm = day.times[d[0]] || '--:--';
    return { k: d[0], label: LABEL[d[0]], hm, t: /^\d\d:\d\d$/.test(hm) ? epochOf(iso, hm, tz) : NaN, minor: !!d[2] };
  });
}
function refreshNext() {
  if (!DAY) { NEXT = null; EVS = []; return; }
  const loc = curLoc(), iso = DAY_DATE, now = Date.now();
  EVS = buildEvents(DAY, iso, loc.tz);
  NEXT = EVS.find(e => e.k !== 'terbit' && e.t > now) || null;
  PREV = null; for (const e of EVS) if (e.t <= now) PREV = e;
  if (!NEXT) {
    const tom = addDays(iso, 1), tt = calcFor(loc, tom), k = S.imsak ? 'imsak' : 'subuh';
    NEXT = { k, label: LABEL[k], hm: tt[k], t: epochOf(tom, tt[k], loc.tz), tomorrow: true };
  }
}

function render() {
  const r = getRoute(), v = $('#view'); if (!v) return;
  const focus = document.activeElement && document.activeElement.id, selStart = document.activeElement && document.activeElement.selectionStart;
  const qv = $('#q') ? $('#q').value : null;
  v.innerHTML = r === 'jadwal' ? viewJadwal() : r === 'kalender' ? viewKalender() : viewPengaturan();
  $('#tabs-in').innerHTML = TABS.map(t => '<button class="tab" data-go="' + t[0] + '"' + (t[0] === r ? ' aria-current="page"' : '') + '>' + svgI(t[0]) + '<span>' + t[1] + '</span></button>').join('');
  if (r === 'pengaturan') {
    const c = $('#city'); if (c) c.value = '';
    if (qv != null && $('#q')) { $('#q').value = qv; if (focus === 'q') { $('#q').focus(); try { $('#q').setSelectionRange(selStart, selStart); } catch (e) { } } }
  }
  renderSheet(); renderForce(); tick();
}
function tick() {
  const cd = $('#cd'), arc = $('#arc');
  if (!NEXT) return;
  const now = Date.now();
  if (DAY_DATE && cityToday(curLoc().tz) !== DAY_DATE) { loadDay(false); return; }
  if (now >= NEXT.t) { refreshNext(); render(); return; }
  if (cd) {
    const s = Math.max(0, Math.round((NEXT.t - now) / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    cd.textContent = 'dalam ' + (hh ? hh + ' j ' : '') + pad(mm) + ' m ' + pad(ss) + ' d';
  }
  if (arc) {
    const start = PREV && PREV.t < NEXT.t ? PREV.t : NEXT.t - 6 * 3600000;
    const p = Math.min(1, Math.max(0, (now - start) / (NEXT.t - start)));
    arc.setAttribute('stroke-dashoffset', (628.3 * (1 - p)).toFixed(1));
  }
}

// ---------- Interaksi ----------
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]');
  if (g) { const to = g.getAttribute('data-go'); if (getRoute() === to) render(); else { location.hash = '#' + to; render(); } window.scrollTo(0, 0); return; }
  const sb = ev.target.closest('[data-set-btn]');
  if (sb) {
    const k = sb.getAttribute('data-set-btn'), v = sb.getAttribute('data-v');
    S[k] = v; save(); if (k === 'theme') applyTheme();
    render(); if (k === 'source' || k === 'asr') loadDay(false);
    return;
  }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.getAttribute('data-act');
  if (act === 'gps') doGPS();
  else if (act === 'search') doSearch($('#q') && $('#q').value);
  else if (act === 'pick') pickResult(+a.getAttribute('data-i'));
  else if (act === 'reload') { store.del('ws.day'); loadDay(true); toast('Memuat ulang…'); }
  else if (act === 'bell') { SHEET = a.getAttribute('data-k'); renderSheet(); }
  else if (act === 'sheetclose') { SHEET = null; stopPreview(); renderSheet(); }
  else if (act === 'setmode') { setMode(SHEET, a.getAttribute('data-v')); }
  else if (act === 'modeall') { setModeAll(modeOf(SHEET)); }
  else if (act === 'preview') { preview(a.getAttribute('data-v')); }
  else if (act === 'soon') toast('Segera hadir.');
  else if (act === 'calview') { S.calView = a.getAttribute('data-v'); save(); render(); }
  else if (act === 'calprev') { CAL_IDX = Math.max(0, calIndex() - 1); render(); }
  else if (act === 'calnext') { CAL_IDX = Math.min(KH.length - 2, calIndex() + 1); render(); }
  else if (act === 'caltoday') { CAL_IDX = null; render(); }
  else if (act === 'calgo') { CAL_IDX = +a.getAttribute('data-i'); S.calView = 'bulan'; save(); render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'q') doSearch(ev.target.value);
  if (ev.key === 'Escape' && SHEET) { SHEET = null; stopPreview(); renderSheet(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('[data-city]')) { if (t.value) pickCityId(t.value); return; }
  const k = t.getAttribute && t.getAttribute('data-set'); if (!k) return;
  S[k] = t.type === 'checkbox' ? t.checked : t.value; save();
  if (k === 'mp') { render(); loadDay(false); return; }
  if (k === 'imsak' || k === 'dhuha') { refreshNext(); render(); scheduleReminders(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); scheduleReminders(); } else if (NATIVE) doSync(); });

// ---------- Pembaruan dan konfigurasi ----------
async function loadAzans() {
  try { const j = await getJSON('azan.json?t=' + Date.now(), 4000); AZANS = (Array.isArray(j) ? j : []).filter(a => a && /^azan\d$/.test(a.id)); } catch (e) { AZANS = []; }
  render();
}
async function checkConfig() {
  try {
    const c = await getJSON(CONFIG_URL + '?t=' + Date.now(), 6000);
    RCFG = Object.assign({}, CFG_DEF, c); store.set('ws.cfg', RCFG); render();
  } catch (e) { /* tanpa internet: pakai salinan terakhir */ }
}

// ---------- Mulai ----------
function init() {
  applyTheme(); render();
  try {
    if ('serviceWorker' in navigator) {
      if (NATIVE) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => { });
      else if (location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  } catch (e) { }
  loadDay(false); loadAzans(); checkConfig();
  setInterval(tick, 1000);
  if (!S.loc || S.loc.mode === 'gps') doGPS();
}
init();

</script>
